<!doctype html>
<!-- ЦеЗошит — локальна версія. Зошит на весь екран, інструменти справа. -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ЦеЗошит — шкільний зошит</title>
  <meta name="description" content="Інтерактивний шкільний зошит: малювання, текст, стікери, QR, таймер. Працює прямо в браузері.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/ui/style.css">
</head>
<body>
  <div id="sz-app">
    <header id="sz-topbar" role="toolbar" aria-label="Меню блокнота"></header>
    <div id="sz-app-layout">
      <div id="sz-workspace">
        <div id="sz-page-wrap">
          <canvas id="sz-canvas" tabindex="0" aria-label="Страница блокнота. Рисуйте мышью, пальцем или стилусом."></canvas>
          <canvas id="sz-overlay" aria-hidden="true"></canvas>
        </div>
        <div id="sz-props" role="toolbar" aria-label="Свойства инструмента"></div>
        <div id="sz-collab-banner" role="status" aria-live="polite"></div>
      </div>
      <nav id="sz-rail" role="toolbar" aria-label="Инструменты" aria-orientation="vertical"></nav>
    </div>
    <footer id="sz-pagesbar">
      <div id="sz-pages" role="navigation" aria-label="Страницы"></div>
    </footer>
  </div>
  <div id="sz-modals"></div>
  <div id="sz-toasts" role="status" aria-live="polite"></div>

  <script src="shared/vendor/qrcode.js"></script>
  <script src="shared/util.js"></script>
  <script src="shared/ai/ai.js"></script>
  <script src="shared/core/doc.js"></script>
  <script src="shared/core/history.js"></script>
  <script src="shared/core/render.js"></script>
  <script src="shared/tools/tools.js"></script>
  <script src="shared/tools/insert.js"></script>
  <script src="shared/ui/storage.js"></script>
  <script src="shared/ui/app.js"></script>
  <script src="shared/ui/topbar.js"></script>
  <script src="shared/ui/toolbar.js"></script>
  <script src="shared/ui/pagesbar.js"></script>
  <script src="shared/ui/modals.js"></script>
  <script src="shared/ui/start.js"></script>
  <script src="shared/collab/collab.js"></script>
  <script src="shared/collab/collab-ui.js"></script>
  <script src="shared/collab/poll.js"></script>
  <script src="transport.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      SZ.App.init({ localMode: true });
      SZ.Start.init();
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    });
  </script>
</body>
</html>
